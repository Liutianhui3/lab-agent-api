[project]
name = "lab-agent-api"
version = "0.1.0"
description = "智能实验室预约系统后端"
readme = "README.md"
authors = [{ name = "刘添慧", email = "jasonliuuzz2@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
  "aiomysql>=0.3.2",
  "alembic>=1.20.1",
  "apscheduler>=3.11.3",
  "bcrypt>=4.0.1,<4.1",
  "chromadb>=1.5.9",
  "cryptography>=50.0.2",
  "fastapi>=0.162.2",
  "langchain>=1.5.0",
  "langchain-core>=1.8.1",
  "langchain-openai>=1.8.0",
  "langgraph>=1.2.22",
  "passlib>=1.7.4",
  "pydantic-settings>=2.16.2",
  "pyjwt>=2.15.1",
  "python-multipart>=0.0.33",
  "redis>=8.1.0",
  "sqlalchemy[asyncio]>=2.1.8",
  "uvicorn[standard]>=0.54.0",
