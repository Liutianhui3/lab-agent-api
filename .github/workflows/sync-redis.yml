name: Sync Redis image

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Copy Redis image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lab-agent-redis:7.2-alpine"
          docker pull --platform linux/amd64 redis:7.2-alpine
          docker tag redis:7.2-alpine "$IMAGE"
          docker push "$IMAGE"