name: lab-agent-api

services:
  redis:
    image: redis:7.2-alpine
    container_name: redis-server
    restart: always
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      - TZ=Asia/Shanghai

volumes:
  redis-data:
    driver: local
